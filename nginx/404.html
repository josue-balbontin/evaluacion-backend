<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: #1a1a2e; color: #e0e0e0;
        }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 6rem; color: #e94560; margin-bottom: 0.5rem; }
        p { font-size: 1.25rem; margin-bottom: 2rem; color: #a0a0b0; }
        a {
            display: inline-block; padding: 0.75rem 2rem;
            background: #e94560; color: #fff; text-decoration: none;
            border-radius: 8px; transition: background 0.3s;
        }
        a:hover { background: #c73650; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The page you are looking for does not exist.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
